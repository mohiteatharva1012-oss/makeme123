<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="360" height="160">
  <defs>
    <linearGradient id="silver-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e3e3e8" />
      <stop offset="40%" stop-color="#8e8e93" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#aeaeb2" />
      <stop offset="100%" stop-color="#c7c7cc" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&amp;family=Outfit:wght@400;500&amp;display=swap');
      .brand-title {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: 52px;
      }
      .brand-subtitle {
        font-family: 'Outfit', sans-serif;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>
  
  <!-- Outer Speech Bubble Path -->
  <path d="M 180 20 H 280 A 45 45 0 0 1 325 65 A 45 45 0 0 1 280 110 H 75 C 60 128, 35 130, 20 120 C 33 116, 42 105, 45 93 A 45 45 0 0 1 80 20 H 180 Z" 
        fill="none" 
        stroke="url(#silver-gradient)" 
        stroke-width="4.5" 
        stroke-linejoin="round"
        stroke-linecap="round" />
        
  <!-- "Make me" Text -->
  <text x="175" y="83" class="brand-title" fill="url(#silver-gradient)" text-anchor="middle">Make me</text>
  
  <!-- Sparkle Star near the 'e' -->
  <path d="M 276 34 Q 276 42 284 42 Q 276 42 276 50 Q 276 42 268 42 Q 276 42 276 34 Z" fill="url(#silver-gradient)" />
  
  <!-- "Unisex Salon" Text -->
  <text x="325" y="142" class="brand-subtitle" fill="#e1e1e6" text-anchor="end">UNISEX SALON</text>
</svg>
