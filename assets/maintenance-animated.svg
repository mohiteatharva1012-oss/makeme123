<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" aria-label="Website Under Maintenance">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="maint-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e7c8" />
      <stop offset="35%" stop-color="#c5a880" />
      <stop offset="70%" stop-color="#e5cda8" />
      <stop offset="100%" stop-color="#8e734c" />
    </linearGradient>

    <linearGradient id="maint-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a880" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#e5cda8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8e734c" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="maint-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5a880" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#c5a880" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08080a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="maint-core-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="60%" stop-color="#121118" />
      <stop offset="100%" stop-color="#09080d" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="maint-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c5a880" flood-opacity="0.25" />
    </filter>

    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseAura {
        0%, 100% { transform: scale(0.96); opacity: 0.4; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes floatShears {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(2deg); }
      }
      @keyframes bladeLeft {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-9deg); }
      }
      @keyframes bladeRight {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(9deg); }
      }
      @keyframes twinkleStar {
        0%, 100% { opacity: 0.2; transform: scale(0.6); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes shimmerGleam {
        0% { transform: translateX(-100%) rotate(45deg); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateX(200%) rotate(45deg); opacity: 0; }
      }

      .gear-rotator {
        transform-origin: 160px 150px;
        animation: spinSlow 24s linear infinite;
      }
      .dash-rotator {
        transform-origin: 160px 150px;
        animation: spinReverse 18s linear infinite;
      }
      .aura-pulse {
        transform-origin: 160px 150px;
        animation: pulseAura 4s ease-in-out infinite;
      }
      .shears-float {
        transform-origin: 160px 145px;
        animation: floatShears 3.5s ease-in-out infinite;
      }
      .blade-anim-l {
        transform-origin: 160px 148px;
        animation: bladeLeft 2.4s ease-in-out infinite;
      }
      .blade-anim-r {
        transform-origin: 160px 148px;
        animation: bladeRight 2.4s ease-in-out infinite;
      }
      .star-1 {
        transform-origin: 75px 85px;
        animation: twinkleStar 2.2s ease-in-out infinite;
      }
      .star-2 {
        transform-origin: 245px 95px;
        animation: twinkleStar 3.1s ease-in-out infinite 0.8s;
      }
      .star-3 {
        transform-origin: 235px 205px;
        animation: twinkleStar 2.6s ease-in-out infinite 1.4s;
      }
      .star-4 {
        transform-origin: 80px 210px;
        animation: twinkleStar 2.8s ease-in-out infinite 0.4s;
      }
    </style>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="160" cy="150" r="140" fill="url(#maint-glow)" class="aura-pulse" />

  <!-- Outer Animated Orbit Rings -->
  <circle cx="160" cy="150" r="128" fill="none" stroke="url(#maint-gold-grad)" stroke-width="1.5" stroke-dasharray="8 12" stroke-opacity="0.45" class="dash-rotator" />
  <circle cx="160" cy="150" r="114" fill="none" stroke="#c5a880" stroke-width="0.8" stroke-dasharray="3 6" stroke-opacity="0.3" class="gear-rotator" />

  <!-- Orbital Accent Nodes -->
  <g class="gear-rotator">
    <circle cx="160" cy="22" r="3.5" fill="#e5cda8" filter="url(#glow-filter)" />
    <circle cx="160" cy="278" r="3.5" fill="#c5a880" />
    <circle cx="32" cy="150" r="2.5" fill="#f5e7c8" />
    <circle cx="288" cy="150" r="2.5" fill="#c5a880" />
  </g>

  <!-- Central Badge Backing & Shadow -->
  <circle cx="160" cy="150" r="95" fill="url(#maint-core-bg)" filter="url(#maint-shadow)" />
  <circle cx="160" cy="150" r="95" fill="none" stroke="url(#maint-gold-grad)" stroke-width="2.5" />
  <circle cx="160" cy="150" r="91" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.12" />

  <!-- Technical Maintenance Gear (Luxury Styled) -->
  <g class="gear-rotator" opacity="0.22">
    <path d="M160,75 L163,85 L174,86 L171,96 L181,100 L175,109 L184,116 L175,123 L181,133 L171,137 L174,147 L163,148 L160,158 L157,148 L146,147 L149,137 L139,133 L145,123 L136,116 L145,109 L139,100 L149,96 L146,86 L157,85 Z"
          fill="none" stroke="url(#maint-gold-grad)" stroke-width="2.5" transform="scale(1.4) translate(-45, -42)" />
  </g>

  <!-- Crossed Salon Tools Group (Scissors & Styling Comb) -->
  <g class="shears-float">
    <!-- Fine Barber Comb (Crossed Background) -->
    <g transform="rotate(-35 160 148)" opacity="0.75">
      <rect x="156" y="92" width="8" height="112" rx="4" fill="url(#maint-gold-grad)" filter="url(#maint-shadow)" />
      <!-- Comb Teeth -->
      <line x1="164" y1="100" x2="173" y2="100" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="106" x2="173" y2="106" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="112" x2="173" y2="112" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="118" x2="173" y2="118" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="124" x2="173" y2="124" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="130" x2="173" y2="130" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="136" x2="173" y2="136" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="142" x2="173" y2="142" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="148" x2="173" y2="148" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="154" x2="173" y2="154" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="160" x2="173" y2="160" stroke="#f5e7c8" stroke-width="1.8" />
      <line x1="164" y1="166" x2="173" y2="166" stroke="#f5e7c8" stroke-width="1.8" />
    </g>

    <!-- Luxury Hairdressing Shears / Scissors (Front Interactive) -->
    <!-- Left Scissor Blade & Handle -->
    <g class="blade-anim-l">
      <!-- Blade -->
      <path d="M160,148 L142,94 C140,88 143,82 147,82 C150,82 153,86 156,92 L162,148 Z" 
            fill="url(#maint-gold-grad)" />
      <!-- Handle Shank -->
      <path d="M160,148 L170,188 L166,192 Z" fill="url(#maint-gold-grad)" />
      <!-- Finger Ring Loop -->
      <circle cx="173" cy="204" r="14" fill="none" stroke="url(#maint-gold-grad)" stroke-width="4.5" />
      <!-- Pinky Tang / Finger Rest -->
      <path d="M185,210 Q194,215 197,222" fill="none" stroke="url(#maint-gold-grad)" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Right Scissor Blade & Handle -->
    <g class="blade-anim-r">
      <!-- Blade -->
      <path d="M160,148 L178,94 C180,88 177,82 173,82 C170,82 167,86 164,92 L158,148 Z" 
            fill="url(#maint-gold-grad)" />
      <!-- Handle Shank -->
      <path d="M160,148 L150,188 L154,192 Z" fill="url(#maint-gold-grad)" />
      <!-- Thumb Ring Loop -->
      <circle cx="147" cy="204" r="14" fill="none" stroke="url(#maint-gold-grad)" stroke-width="4.5" />
    </g>

    <!-- Scissor Pivot Screw / Jewel Center -->
    <circle cx="160" cy="148" r="5.5" fill="#f5e7c8" stroke="#8e734c" stroke-width="1.5" filter="url(#glow-filter)" />
    <circle cx="160" cy="148" r="2" fill="#09080d" />
  </g>

  <!-- Twinkling Sparkles (Luxury 4-Point Stars) -->
  <!-- Star 1 (Top Left) -->
  <g class="star-1" fill="#f5e7c8" filter="url(#glow-filter)">
    <path d="M75,85 Q75,76 71,76 Q75,76 75,67 Q75,76 79,76 Q75,76 75,85 Z" />
  </g>
  <!-- Star 2 (Top Right) -->
  <g class="star-2" fill="#e5cda8" filter="url(#glow-filter)">
    <path d="M245,95 Q245,84 240,84 Q245,84 245,73 Q245,84 250,84 Q245,84 245,95 Z" />
  </g>
  <!-- Star 3 (Bottom Right) -->
  <g class="star-3" fill="#f5e7c8" filter="url(#glow-filter)">
    <path d="M235,205 Q235,198 231,198 Q235,198 235,191 Q235,198 239,198 Q235,198 235,205 Z" />
  </g>
  <!-- Star 4 (Bottom Left) -->
  <g class="star-4" fill="#e5cda8" filter="url(#glow-filter)">
    <path d="M80,210 Q80,203 76,203 Q80,203 80,196 Q80,203 84,203 Q80,203 80,210 Z" />
  </g>

  <!-- Lower Maintenance Status Capsule Ribbon -->
  <g transform="translate(0, 10)">
    <rect x="70" y="248" width="180" height="34" rx="17" fill="#14131b" stroke="url(#maint-gold-grad)" stroke-width="1.5" filter="url(#maint-shadow)" />
    
    <!-- Pulsing Live Dot -->
    <circle cx="92" cy="265" r="4.5" fill="#f39c12" filter="url(#glow-filter)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;5;3.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    
    <!-- Maintenance Text -->
    <text x="164" y="270" font-family="'Outfit', -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#f5e7c8" letter-spacing="2" text-anchor="middle">
      MAINTENANCE
    </text>
  </g>
</svg>
